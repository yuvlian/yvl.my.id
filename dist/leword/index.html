<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leword</title>
    <meta property="og:title" content="Leword">
    <meta property="og:description" content="No more searching 5 letter word containing x ending with y.">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px auto;
            max-width: 100%;
        }

        .tile {
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            user-select: none;
            color: #333;
            background: #eee;
        }

        .tile.gray {
            background: #bdbdbd;
        }

        .tile.yellow {
            background: #ffc400;
            color: #5a4b00;
        }

        .tile.green {
            background: #00b300;
            color: #003d00;
        }

        .tile input {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            outline: none;
        }

        .tile.selected {
            outline: 3px solid #000;
        }

        .color-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        button {
            background: #006cff;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        .results {
            margin-top: 20px;
            text-align: left;
        }

        .word-list {
            max-height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .box {
                padding: 15px;
            }

            .tile,
            .tile input {
                font-size: 20px;
            }

            .color-btn {
                font-size: 15px;
            }
        }
    </style>

</head>

<body>
    <noscript>
        <div class="box">
            <strong>JavaScript is required to use this page.</strong>
        </div>
        <br>
    </noscript>
    <div class="box">
        <h2>Leword</h2>
        <label>So you don't have to google "5 letter word containing ... ending with ..."</label>
        <hr style="margin:20px 0;opacity:0.3;">
        <div class="grid" id="grid"></div>
        <button class="color-btn" data-color="gray">Gray</button>
        <button class="color-btn" data-color="yellow">Yellow</button>
        <button class="color-btn" data-color="green">Green</button>
        <hr style="margin:20px 0;opacity:0.3;">
        <div class="results">
            <h3>Valid words (<span id="count">0</span>)</h3>
            <div class="word-list" id="wordList"></div>
        </div>
    </div>
    <script src="guh.js" defer></script>
</body>

</html>
