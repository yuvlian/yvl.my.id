<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>leword</title>
    <meta property="og:title" content="Leword">
    <meta property="og:description" content="No more searching 5 letter word containing x ending with y. Includes a Wordle solver.">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: #f2f2f2;
        }

        .box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        .row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .word-input {
            width: 150px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            background: #fff;
        }

        .color-grid {
            display: flex;
            gap: 4px;
        }

        .color-box {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            cursor: pointer;
            background: #eee;
            border: 1px solid #ddd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-transform: uppercase;
        }

        .color-box.gray {
            background: #bdbdbd;
            border-color: #999;
        }

        .color-box.yellow {
            background: #ffc400;
            border-color: #d4a300;
        }

        .color-box.green {
            background: #00b300;
            border-color: #008a00;
        }

        button {
            background: #006cff;
            color: white;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 10px;
            margin: 20px 0 8px 0;
            border-radius: 8px;
            font-size: 16px;
        }

        .results {
            margin-top: 20px;
            text-align: left;
        }

        .word-list {
            max-height: 220px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            background: #f7f7f7;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            word-break: break-all;
        }

        #mode-switch {
            display: flex;
            gap: 8px;
            margin: 15px 0 0 0;
        }

        .mode-btn {
            flex: 1;
            margin: 0;
            width: auto;
            background: #eee;
            color: #333;
            font-weight: bold;
        }

        .mode-btn.active {
            background: #006cff;
            color: white;
        }

        .color-box.unset {
            background: #fff;
            color: #999;
            border: 1px dashed #bbb;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .box {
                padding: 15px;
            }

            .row {
                gap: 8px;
            }

            .word-input {
                width: 90px;
                font-size: 14px;
                padding: 6px;
                letter-spacing: 1px;
            }

            .color-box {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <noscript>
        <div class="box">
            <strong>JavaScript is required to use this page.</strong>
        </div>
        <br>
    </noscript>
    <div class="box">
        <h2>Leword</h2>
        <label id="subtitle">So you don't have to google "5 letter word containing ... ending with ..."</label>
        <div id="mode-switch">
            <button class="mode-btn active" id="mode-filter">Word Finder</button>
            <button class="mode-btn" id="mode-solver">Wordle Solver</button>
        </div>
        <div id="finder-ui">
            <hr style="margin:20px 0;opacity:0.3;">
            <div id="inputs-container"></div>
            <button onclick="resetAll()">Reset All</button>
        </div>
        <div id="solver-ui" style="display:none;">
            <hr style="margin:20px 0;opacity:0.3;">
            <div id="solver-rows"></div>
            <button onclick="resetSolve()">Reset All</button>
        </div>
        <div id="results" style="display:none;">
            <h3 id="results-title">Valid words (<span id="count">0</span>)</h3>
            <div class="word-list" id="wordList"></div>
        </div>
    </div>
    <script src="guh.js" defer></script>
</body>

</html>
