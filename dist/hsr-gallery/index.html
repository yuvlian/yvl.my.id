<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hsr-gallery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: sans-serif;
      background-color: #fff;
      color: #000;
      padding: 20px;
    }

    .gallery-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .artwork-card {
      border: 1px solid #ccc;
      padding: 10px;
    }

    .image-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      background-color: #eee;
      margin-bottom: 10px;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .character-name {
      font-weight: bold;
      font-size: 1rem;
    }

    .artist-name {
      font-size: 0.9rem;
      color: #555;
    }

    .loading,
    .error {
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div id="loading" class="loading">Loading...</div>
  <div id="gallery" class="gallery-container"></div>
  <div id="error" class="error" style="display: none;">Failed to load.</div>
  <script>

      "8008": "Trailblazer"
    };

    async function initGallery() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');

      try {
        const response = await fetch(GALLERY_JSON_URL);
        if (!response.ok) throw new Error('Failed to fetch data');

        const galleryData = await response.json();
        loadingEl.style.display = 'none';

        const artworks = [];
        for (const [charId, images] of Object.entries(galleryData)) {
          const charName = CHARACTER_NAMES[charId] || `Character ${charId}`;

          for (const [order, info] of Object.entries(images)) {
            artworks.push({
              charId,
              charName,
              order: parseInt(order),
              filename: info.filename,
              credit: info.credit_text || 'Unknown Artist',
              url: `${ASSET_BASE_URL}${charId}/${info.filename}`
            });
          }
        }

        artworks.sort((a, b) => {
          if (a.charId !== b.charId) return a.charId.localeCompare(b.charId);
          return a.order - b.order;
        });

        renderGallery(artworks);
      } catch (err) {
        console.error(err);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
      }
    }

    function renderGallery(artworks) {
      const galleryEl = document.getElementById('gallery');

      artworks.forEach(art => {
        const card = document.createElement('div');
        card.className = 'artwork-card';
        card.innerHTML = `
      <div class="image-wrapper">
        <img src="${art.url}" alt="${art.charName}" width="512" height="512">
      </div>
      <div class="character-name">${art.charName}</div>
      <div class="artist-name">Artist: ${art.credit}</div>
    `;
        galleryEl.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', initGallery);
  </script>
</body>

</html>
